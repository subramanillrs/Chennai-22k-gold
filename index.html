<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#100e0a" media="(prefers-color-scheme: dark)">
<meta name="description" content="22K Gold Price Tracker & Valuation Dashboard">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,680&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<title>Gold 22k rate</title>

<style>
:root {
  color-scheme: light dark;
  --font-display: "Fraunces", "Iowan Old Style", "Georgia", serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* Type scale -- every font-size in the app maps to one of these
     steps. Keeps micro-labels, data values, and headings consistent
     instead of dozens of one-off sizes.
     Floor raised to 11px (0.6875rem) to meet Apple HIG (11pt minimum)
     and Material 3 (12sp body-small) guidance; rem units so the scale
     respects the OS/browser text-size setting instead of staying fixed. */
  --fs-2xs: 0.6875rem; /* 11px -- chart legend, mini pills (was 9.5px) */
  --fs-xs: 0.6875rem;  /* 11px -- eyebrow / faint labels (was 10px) */
  --fs-xs2: 0.6875rem; /* 11px -- secondary labels, form labels (was 10.5px) */
  --fs-sm: 0.75rem;    /* 12px -- buttons, small body (was 11px) */
  --fs-sm2: 0.75rem;   /* 12px -- pills, small emphasis (was 11.5px) */
  --fs-base: 0.8125rem;/* 13px -- body text (was 12px) */
  --fs-base2: 0.8125rem;/* 13px -- emphasized body (was 12.5px) */
  --fs-md: 0.875rem;   /* 14px -- inputs, sub-headers (was 13px) */
  --fs-md2: 0.875rem;  /* 14px -- eyebrow display italic (was 13.5px) */
  --fs-lg: 0.9375rem;  /* 15px -- data values: ledger, horizon, table rows (was 14px) */
  --fs-lg2: 1rem;      /* 16px -- hero-foot values (was 15px) */
  --fs-xl: 1.0625rem;  /* 17px -- section heads (unchanged, matches Apple Body) */
  --fs-xl2: 1.1875rem; /* 19px -- emphasis numbers (unchanged) */
  --fs-2xl: 1.375rem;  /* 22px -- receipt total (unchanged) */

  --r-xs: 4px;    /* tiny accents: section marker, sync-dot corner */
  --r-sm: 8px;    /* chips, small buttons, badges */
  --r-ctrl: 10px; /* 40px-tall controls: quote button, toast, inline share link */
  --r-md: 14px;   /* cards, panels, collapsibles */
  --r-lg: 22px;   /* hero card */
  --r-xl: 28px;   /* (reserved for largest surfaces) */
  --r-full: 9999px; /* pills, avatars, segmented controls */

  --paper: #f8f4ea;
  --bg: #f8f4ea;
  --paper-raised: #ffffff;
  --paper-sunken: #f0eadb;

  --rule: #e3dac4;
  --rule-strong: #cdbe9d;

  --ink: #1c1712;
  --ink-soft: #6b6255;
  --ink-faint: #786f60; /* darkened from #a89d88 (2.44:1) to clear WCAG AA 4.5:1 on paper and cards */

  --gold: #a97f34;
  --gold-deep: #6b5223;
  --gold-glow: #e8c988;
  --gold-tint: rgba(169, 127, 52, 0.1);
  --gold-line: rgba(169, 127, 52, 0.32);

  --good: #337a4c;
  --good-glow: #7bd39a;
  --good-bg: #e1efe4;
  --bad: #ad3d30;
  --bad-glow: #f0857a;
  --bad-bg: #f5e2df;

  /* glass surfaces -- translucent, blurred, layered rather than flat white cards */
  --glass-surface: rgba(255, 255, 255, 0.6);
  --glass-surface-strong: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --glass-blur: 20px;

  /* material-style elevation: tonal shifts + soft directional shadow, not one shadow-fits-all */
  --elev-1: 0 1px 2px rgba(28, 23, 18, 0.05), 0 1px 1px rgba(28, 23, 18, 0.04);
  --elev-2: 0 2px 8px -2px rgba(28, 23, 18, 0.10), 0 8px 24px -12px rgba(28, 23, 18, 0.14);
  --elev-3: 0 8px 20px -6px rgba(28, 23, 18, 0.16), 0 24px 48px -20px rgba(28, 23, 18, 0.22);

  --shadow-card: var(--elev-2);
  --transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --spring: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #100e0a;
    --bg: #100e0a;
    --paper-raised: #1c1912;
    --paper-sunken: #0a0906;
    --rule: #2a2620;
    --rule-strong: #3a342a;
    --ink: #f2ede2;
    --ink-soft: #a89d88;
    --ink-faint: #888177; /* lightened from #6b6255 (3.22:1) to clear WCAG AA 4.5:1 on dark paper */
    --gold: #d4ab63;
    --gold-deep: #e8c988;
    --gold-glow: #f4dca0;
    --gold-tint: rgba(212, 171, 99, 0.14);
    --gold-line: rgba(212, 171, 99, 0.32);
    --good: #7bd39a;
    --good-glow: #7bd39a;
    --good-bg: rgba(63, 110, 74, 0.2);
    --bad: #e0897c;
    --bad-glow: #e0897c;
    --bad-bg: rgba(161, 63, 52, 0.2);

    --glass-surface: rgba(35, 31, 23, 0.55);
    --glass-surface-strong: rgba(40, 36, 27, 0.72);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.12);

    --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --elev-2: 0 2px 8px -2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    --elev-3: 0 8px 20px -6px rgba(0, 0, 0, 0.4), 0 24px 48px -20px rgba(0, 0, 0, 0.6);
    --shadow-card: var(--elev-2);
  }
}

html[data-theme="light"] {
  --paper: #f8f4ea; --paper-raised: #ffffff; --paper-sunken: #f0eadb;
  --rule: #e3dac4; --rule-strong: #cdbe9d;
  --ink: #1c1712; --ink-soft: #6b6255; --ink-faint: #786f60;
  --gold: #a97f34; --gold-deep: #6b5223; --gold-glow: #e8c988;
  --gold-tint: rgba(169, 127, 52, 0.1); --gold-line: rgba(169, 127, 52, 0.32);
  --good: #337a4c; --good-glow: #7bd39a; --good-bg: #e1efe4;
  --bad: #ad3d30; --bad-glow: #f0857a; --bad-bg: #f5e2df;
  --glass-surface: rgba(255, 255, 255, 0.6);
  --glass-surface-strong: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --elev-1: 0 1px 2px rgba(28, 23, 18, 0.05), 0 1px 1px rgba(28, 23, 18, 0.04);
  --elev-2: 0 2px 8px -2px rgba(28, 23, 18, 0.10), 0 8px 24px -12px rgba(28, 23, 18, 0.14);
  --elev-3: 0 8px 20px -6px rgba(28, 23, 18, 0.16), 0 24px 48px -20px rgba(28, 23, 18, 0.22);
  --shadow-card: var(--elev-2);
}

html[data-theme="dark"] {
  --paper: #100e0a; --bg: #100e0a; --paper-raised: #1c1912; --paper-sunken: #0a0906;
  --rule: #2a2620; --rule-strong: #3a342a;
  --ink: #f2ede2; --ink-soft: #a89d88; --ink-faint: #888177;
  --gold: #d4ab63; --gold-deep: #e8c988; --gold-glow: #f4dca0;
  --gold-tint: rgba(212, 171, 99, 0.14); --gold-line: rgba(212, 171, 99, 0.32);
  --good: #7bd39a; --good-glow: #7bd39a; --good-bg: rgba(63, 110, 74, 0.2);
  --bad: #e0897c; --bad-glow: #e0897c; --bad-bg: rgba(161, 63, 52, 0.2);
  --glass-surface: rgba(35, 31, 23, 0.55);
  --glass-surface-strong: rgba(40, 36, 27, 0.72);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.12);
  --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --elev-2: 0 2px 8px -2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  --elev-3: 0 8px 20px -6px rgba(0, 0, 0, 0.4), 0 24px 48px -20px rgba(0, 0, 0, 0.6);
  --shadow-card: var(--elev-2);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* Expanded invisible hit-areas so small round icon buttons still meet the
   44x44pt (Apple HIG) / 48x48dp (Material 3) minimum touch target, without
   growing their visual footprint in the tightly-packed masthead row. */
.theme-toggle, .target-toggle, .target-close, .banner-dismiss, .share-icon-btn {
  position: relative;
}
.theme-toggle::before, .target-toggle::before, .target-close::before,
.banner-dismiss::before, .share-icon-btn::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: max(44px, 100%);
  height: max(44px, 100%);
  transform: translate(-50%, -50%);
}

html {
  font-family: var(--font-sans);
  background-color: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  touch-action: pan-y pinch-zoom;
}

body {
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  background:
    radial-gradient(680px 420px at 18% -6%, var(--gold-tint), transparent 60%),
    radial-gradient(520px 360px at 100% 18%, rgba(63, 122, 76, 0.06), transparent 65%),
    var(--paper);
}
input, select { user-select: auto; -webkit-user-select: auto; }
button, input, select { font-family: inherit; color: inherit; border: none; background: none; outline: none; }

/* :focus-visible restores a keyboard/switch-control focus ring that the
   outline:none reset above removes. Scoped to :focus-visible (not :focus)
   so mouse/touch taps stay clean and only actual keyboard navigation shows
   the ring -- required for WCAG 2.2 SC 2.4.7 (Focus Visible). */
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
[tabindex]:focus-visible, summary:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}
/* Round controls get a round ring so it doesn't look like a stray square. */
.theme-toggle:focus-visible, .target-toggle:focus-visible, .target-close:focus-visible,
.banner-dismiss:focus-visible, .share-icon-btn:focus-visible, .chip:focus-visible,
.segment-ctrl button:focus-visible, .calc-mode-btn:focus-visible {
  outline-offset: 1px;
}

/* Visually hides content while keeping it in the accessibility tree --
   for labels/headings screen readers need but the visual design doesn't. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.num, td, .amount,
.hero-foot-val, .ledger-val, .sma-value, .primary-metric strong, .sec-metric b,
.last-box .amount, .horizon-box b, .compare-result-top, .receipt-total .final-val,
.port-table td {
  font-variant-numeric: tabular-nums lining-nums;
  user-select: text; -webkit-user-select: text;
}

.app {
  width: 100%;
  max-width: 600px;
  padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
}

.masthead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding-bottom: 10px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.brand-badge {
  width: 28px;
  height: 28px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--gold-glow), var(--gold) 55%, var(--gold-deep));
  color: #ffffff;
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(169, 127, 52, 0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  flex-shrink: 0;
}

.masthead-title {
  font-family: var(--font-display);
  font-size: clamp(18px, 5vw, 26px);
  font-weight: 600;
  font-style: italic;
  letter-spacing: -0.01em;
  color: var(--ink);
  line-height: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.masthead-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 14px;
  background: var(--glass-surface-strong);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-full);
  font-size: var(--fs-xs2);
  font-weight: 600;
  color: var(--ink-soft);
  white-space: nowrap;
  max-width: 138px;
  flex-shrink: 1;
  min-width: 0;
  box-shadow: var(--elev-1);
}
.status-pill span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; animation: pulse-ring 2s infinite; box-shadow: 0 0 6px var(--good-glow); }
.status-pill .ae-fresh-dot,
.status-pill > span:not(.status-dot):not(#statusText) { display: none !important; }
.status-pill.offline .status-dot { background: var(--bad); animation: none; box-shadow: 0 0 6px var(--bad-glow); }
.status-pill.syncing .status-dot { background: var(--gold); animation: spin 0.8s linear infinite; border-radius: 1px; }

@keyframes pulse-ring { 0% { transform: scale(0.9); opacity: 0.75; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.75; } }
@keyframes spin { to { transform: rotate(360deg); } }

.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; flex-shrink: 0;
  background: var(--glass-surface);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border); border-radius: 50%;
  color: var(--ink-soft); cursor: pointer; transition: all var(--transition);
  box-shadow: var(--elev-1);
}
.theme-toggle:active { transform: scale(0.9); background: var(--paper-sunken); }
.theme-toggle svg { width: 13px; height: 13px; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

.health-collapsible {
  background: var(--glass-surface-strong);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: var(--elev-1);
}
.health-collapsible summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  list-style: none;
  user-select: none;
}
.health-collapsible summary::-webkit-details-marker { display: none; }
.health-summary-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding-right: 10px;
}
.health-summary-left { display: flex; align-items: center; gap: 8px; }
.feed-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; box-shadow: 0 0 6px var(--good-glow); }
.health-collapsible.status-stale .feed-dot { background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
.health-collapsible.status-disagreeing .feed-dot { background: var(--bad); box-shadow: 0 0 6px var(--bad-glow); }
.health-title { font-size: var(--fs-base); font-weight: 700; color: var(--ink); }
.health-badge {
  font-size: var(--fs-2xs);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 4px 8px;
  border-radius: var(--r-full);
  background: var(--good-bg);
  color: var(--good);
}
.health-collapsible.status-stale .health-badge { background: var(--gold-tint); color: var(--gold-deep); }
.health-collapsible.status-disagreeing .health-badge { background: var(--bad-bg); color: var(--bad); }
.health-collapsible .collapsible-content {
  padding: 10px 14px;
  border-top: 1px dashed var(--rule);
  font-size: var(--fs-sm2);
  color: var(--ink-soft);
  line-height: 1.45;
  background: transparent;
}

.notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  border: 1px solid var(--bad);
  border-left-width: 3px;
  border-radius: var(--r-md);
  color: var(--bad);
  background: var(--bad-bg);
  width: 100%;
  cursor: pointer;
}
.notice[hidden] { display: none !important; }
.notice.notice-gold { border-color: var(--gold-line); background: var(--gold-tint); color: var(--gold-deep); cursor: default; }
.notice-body { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.notice-body strong { font-size: var(--fs-base2); font-weight: 700; display: flex; justify-content: space-between; }
.notice-body p { font-size: var(--fs-sm2); font-weight: 500; line-height: 1.4; color: var(--ink-soft); }
.notice-dismiss { font-size: var(--fs-2xs); opacity: 0.75; font-weight: 600; }

.hero {
  background:
    radial-gradient(120% 140% at 50% -10%, var(--gold-tint), transparent 60%),
    var(--glass-surface-strong);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  padding: 44px 24px 24px;
  box-shadow: var(--elev-3), inset 0 1px 0 var(--glass-highlight);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  top: -60%; left: 50%;
  width: 140%; height: 140%;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, var(--gold-glow), transparent 70%);
  opacity: 0.16;
  pointer-events: none;
  filter: blur(10px);
}
.hero-top-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 8px;
}
.hero-top-spacer {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}
.hero-eyebrow {
  font-family: var(--font-display);
  font-style: italic;
  font-size: var(--fs-md2);
  font-weight: 440;
  color: var(--gold-deep);
  position: relative;
  flex: 1;
  text-align: center;
  min-width: 0;
}
.hero-price {
  font-family: var(--font-display);
  font-size: clamp(52px, 15vw, 78px);
  font-weight: 680;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  justify-content: center;
  text-align: center;
  width: 100%;
  position: relative;
}
.hero-rule { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--rule-strong), transparent); margin: 2px 0; position: relative; }
.hero-foot { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 16px; position: relative; }
.hero-foot-col { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; text-align: left; }
.hero-foot-col:last-child { text-align: right; }
.hero-foot-label { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-faint); letter-spacing: 0.01em; line-height: 1.2; }
.hero-foot-val { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; line-height: 1.2; }
.hero-foot-col:last-child .hero-foot-val { justify-content: flex-end; }
#hero1.hero-foot-val { font-size: var(--fs-xl2); }
.hero-foot-sub { font-size: var(--fs-xs2); font-weight: 500; color: var(--ink-soft); line-height: 1.2; }

/* Viewing-date badge: hidden by default (viewingDate === null, i.e.
   showing live/today). Shown only when the hero timeline has been
   scrubbed to a past day, so the person always knows they're not
   looking at "now" and has one tap back to live. */
.hero-viewing-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-sans); font-size: var(--fs-xs2); font-weight: 700;
  color: var(--gold-deep); background: var(--gold-tint);
  border: 1px solid var(--gold-line); border-radius: var(--r-full);
  padding: 4px 12px; margin-top: 2px; cursor: pointer;
  transition: background var(--transition), transform var(--transition);
}
