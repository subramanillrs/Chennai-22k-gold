<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Chennai Gold Rate</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">CHENNAI · GOLD RATE</div>
    <h1>22K Gold</h1>
  </div>
  <button id="refresh" class="icon-btn" aria-label="Refresh">↻</button>
</header>

<main>
  <section class="hero">
    <div class="status" id="status">Loading verified data…</div>
    <div class="price" id="price8">—</div>
    <div class="unit">8 grams · 22K</div>
    <div class="subprice" id="price1">— / gram</div>
    <div class="change" id="change">—</div>
  </section>

  <section class="cards">
    <article><span>24K · 8g</span><strong id="p24">—</strong></article>
    <article><span>22K · 1g</span><strong id="p22">—</strong></article>
    <article><span>Last change</span><strong id="lastChange">—</strong></article>
    <article><span>Data date</span><strong id="dataDate">—</strong></article>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div><h2>Trend</h2><p>22K · ₹/gram</p></div>
      <div class="ranges">
        <button data-days="30">1M</button>
        <button data-days="90">3M</button>
        <button data-days="180">6M</button>
        <button data-days="365">1Y</button>
        <button class="active" data-days="1095">3Y</button>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </section>

  <section class="panel">
    <div class="panel-head"><div><h2>Recent changes</h2><p>AM / PM preserved separately</p></div></div>
    <div id="history" class="history"></div>
  </section>

  <section class="source">
    <strong>Data integrity</strong>
    <p id="sourceText">Checking source and freshness…</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
