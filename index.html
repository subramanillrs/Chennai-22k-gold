<style>
/* =========================================================
   DESIGN TOKENS & ALIGNMENT SYSTEM
   ========================================================= */
:root {
  color-scheme: light dark;

  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Text", Helvetica, Arial, sans-serif;
  
  /* Light Palette */
  --bg-app: #f6f7f9;
  --surface: #ffffff;
  --surface-alt: #f0f2f5;
  --surface-hover: #e8ebf0;

  --border-subtle: #e2e5eb;
  --border-strong: #cbd1db;

  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-dim: #94a3b8;

  --gold-primary: #d97706;
  --gold-dark: #b45309;
  --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  --gold-bg: #fef3c7;
  --gold-border: rgba(217, 119, 6, 0.25);

  --good: #059669;
  --good-bg: #d1fae5;
  --bad: #dc2626;
  --bad-bg: #fee2e2;

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.03);
  --shadow-fab: 0 6px 20px rgba(0, 0, 0, 0.10), 0 0 0 1px rgba(0, 0, 0, 0.06);

  --transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-app: #0d0f12;
    --surface: #15181e;
    --surface-alt: #1c2028;
    --surface-hover: #242934;

    --border-subtle: #252a35;
    --border-strong: #373e4f;

    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;

    --gold-primary: #fbbf24;
    --gold-dark: #f59e0b;
    --gold-gradient: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
    --gold-bg: rgba(245, 158, 11, 0.12);
    --gold-border: rgba(251, 191, 36, 0.25);

    --good: #34d399;
    --good-bg: rgba(5, 150, 105, 0.15);
    --bad: #f87171;
    --bad-bg: rgba(220, 38, 38, 0.15);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.35);
    --shadow-fab: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
  }
}

/* =========================================================
   BASE RESETS & VIEWPORT LOCKING (PREVENTS ACCIDENTAL ZOOM)
   ========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-family: var(--font-stack);
  background-color: var(--bg-app);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  touch-action: pan-y;
}

body {
  margin: 0;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}

input, select {
  user-select: auto;
  -webkit-user-select: auto;
}

.num, [data-num], td, strong, b, h2, .rate, .value, .amount, .hero-sub-val {
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -0.015em;
}

.app {
  width: 100%;
  max-width: 680px;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

button, input, select {
  font-family: inherit;
  color: inherit;
  border: none;
  background: none;
  outline: none;
}

/* =========================================================
   TOPBAR & STATUS
   ========================================================= */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-badge {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--gold-bg);
  border: 1px solid var(--gold-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-primary);
  font-size: 19px;
  font-weight: 800;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
}

.brand-text h1 {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.2;
}

.brand-text p {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}

.status-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
  box-shadow: var(--shadow-sm);
  align-self: flex-start;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: var(--good);
  box-shadow: 0 0 0 3px var(--good-bg);
  animation: pulse-ring 2s infinite;
}

.status-indicator.offline .dot {
  background-color: var(--bad);
  box-shadow: 0 0 0 3px var(--bad-bg);
  animation: none;
}

@keyframes pulse-ring {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.8; }
}

/* =========================================================
   HERO CARD
   ========================================================= */
.hero {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hero-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gold-primary);
}

.change-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
}

.change-pill.up { background: var(--good-bg); color: var(--good); }
.change-pill.down { background: var(--bad-bg); color: var(--bad); }
.change-pill.same { background: var(--surface-alt); color: var(--text-muted); }

.hero-mid {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hero-mid h2 {
  font-size: clamp(38px, 8vw, 52px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
}

.hero-mid .sub {
  font-size: 13px;
  color: var(--text-muted);
}

.hero-bottom {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
}

.hero-sub-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

.hero-sub-val {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
}

/* =========================================================
   GRID SYSTEMS WITH STRICT HORIZONTAL ALIGNMENT
   ========================================================= */
.section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 2px;
}

.section-head h3 {
  font-size: 15px;
  font-weight: 700;
}

.section-head span {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-card);
}

/* Quick Stats 4-Grid */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

@media (min-width: 540px) {
  .quick-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 96px;
  box-shadow: var(--shadow-card);
}

.stat-card .label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
}

.stat-card .value {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}

.stat-card .sub {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Intraday Sessions Grid */
.session-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.session-box {
  background: var(--surface-alt);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 105px;
}

.session-box .tag {
  align-self: flex-start;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 6px;
  border-radius: var(--radius-xs);
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
}

.session-box .rate {
  font-size: 19px;
  font-weight: 700;
}

.session-box .time {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
}

/* =========================================================
   CHART CONTROLS & PANEL
   ========================================================= */
.segment-ctrl {
  display: flex;
  gap: 4px;
  background: var(--surface-alt);
  padding: 3px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  overflow-x: auto;
  scrollbar-width: none;
}
.segment-ctrl::-webkit-scrollbar { display: none; }

.segment-ctrl button {
  flex: 1;
  min-width: 44px;
  padding: 6px 8px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}

.segment-ctrl button.active {
  background: var(--surface);
  color: var(--text-main);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}

.chart-stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.metric-card {
  background: var(--surface-alt);
  border-radius: var(--radius-xs);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.metric-card small {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-dim);
}

.metric-card b {
  font-size: 13.5px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.metric-card b.positive { color: var(--good); }
.metric-card b.negative { color: var(--bad); }

.chartwrap {
  width: 100%;
  height: 220px;
  position: relative;
}

.chartwrap canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.chartmeta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-subtle);
}

/* =========================================================
   FORMS, CALCULATOR & ITEMIZED RECEIPT
   ========================================================= */
.calc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.calc-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.calc-field label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
}

.calc-input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  background: var(--surface-alt);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  transition: border-color var(--transition), background-color var(--transition);
}

.calc-input:focus {
  border-color: var(--gold-primary);
  background: var(--surface);
}

select.calc-input {
  cursor: pointer;
}

.receipt-box {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--surface-alt);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.receipt-title {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  padding-bottom: 4px;
  border-bottom: 1px dashed var(--border-subtle);
}

.receipt-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--text-muted);
}

.receipt-line span:last-child {
  font-weight: 600;
  color: var(--text-main);
}

.receipt-total {
  margin-top: 4px;
  padding-top: 8px;
  border-top: 1px solid var(--border-strong);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
