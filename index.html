<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100e0a" media="(prefers-color-scheme: dark)">
<meta name="description" content="22K Gold Price Tracker & Valuation Dashboard">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold 22k rate">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,680&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<title>Gold 22k rate</title>

<style>
:root {
  color-scheme: light dark;
  --font-display: "Fraunces", "Iowan Old Style", "Georgia", serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* Type scale -- every font-size in the app maps to one of these
     steps. Keeps micro-labels, data values, and headings consistent
     instead of dozens of one-off sizes. */
  --fs-2xs: 9.5px;   /* chart legend, mini pills */
  --fs-xs: 10px;     /* eyebrow / faint labels */
  --fs-xs2: 10.5px;  /* secondary labels, form labels */
  --fs-sm: 11px;     /* buttons, small body */
  --fs-sm2: 11.5px;  /* pills, small emphasis */
  --fs-base: 12px;   /* body text */
  --fs-base2: 12.5px;/* emphasized body */
  --fs-md: 13px;     /* inputs, sub-headers */
  --fs-md2: 13.5px;  /* eyebrow display italic */
  --fs-lg: 14px;     /* data values: ledger, horizon, table rows */
  --fs-lg2: 15px;    /* hero-foot values (rate/gram + date match exactly) */
  --fs-xl: 17px;     /* section heads */
  --fs-xl2: 19px;    /* emphasis numbers */
  --fs-2xl: 22px;    /* receipt total */
  --fs-hero: clamp(44px, 12vw, 66px);

  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-full: 9999px;

  --paper: #f8f4ea;
  --bg: #f8f4ea;
  --paper-raised: #ffffff;
  --paper-sunken: #f0eadb;

  --rule: #e3dac4;
  --rule-strong: #cdbe9d;

  --ink: #1c1712;
  --ink-soft: #6b6255;
  --ink-faint: #a89d88;

  --gold: #a97f34;
  --gold-deep: #6b5223;
  --gold-glow: #e8c988;
  --gold-tint: rgba(169, 127, 52, 0.1);
  --gold-line: rgba(169, 127, 52, 0.32);

  --good: #337a4c;
  --good-glow: #7bd39a;
  --good-bg: #e1efe4;
  --bad: #ad3d30;
  --bad-glow: #f0857a;
  --bad-bg: #f5e2df;

  /* glass surfaces -- translucent, blurred, layered rather than flat white cards */
  --glass-surface: rgba(255, 255, 255, 0.6);
  --glass-surface-strong: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --glass-blur: 20px;

  /* material-style elevation: tonal shifts + soft directional shadow, not one shadow-fits-all */
  --elev-1: 0 1px 2px rgba(28, 23, 18, 0.05), 0 1px 1px rgba(28, 23, 18, 0.04);
  --elev-2: 0 2px 8px -2px rgba(28, 23, 18, 0.10), 0 8px 24px -12px rgba(28, 23, 18, 0.14);
  --elev-3: 0 8px 20px -6px rgba(28, 23, 18, 0.16), 0 24px 48px -20px rgba(28, 23, 18, 0.22);

  --shadow-card: var(--elev-2);
  --transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --spring: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #100e0a;
    --bg: #100e0a;
    --paper-raised: #1c1912;
    --paper-sunken: #0a0906;
    --rule: #2a2620;
    --rule-strong: #3a342a;
    --ink: #f2ede2;
    --ink-soft: #a89d88;
    --ink-faint: #6b6255;
    --gold: #d4ab63;
    --gold-deep: #e8c988;
    --gold-glow: #f4dca0;
    --gold-tint: rgba(212, 171, 99, 0.14);
    --gold-line: rgba(212, 171, 99, 0.32);
    --good: #7bd39a;
    --good-glow: #7bd39a;
    --good-bg: rgba(63, 110, 74, 0.2);
    --bad: #e0897c;
    --bad-glow: #e0897c;
    --bad-bg: rgba(161, 63, 52, 0.2);

    --glass-surface: rgba(35, 31, 23, 0.55);
    --glass-surface-strong: rgba(40, 36, 27, 0.72);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.12);

    --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --elev-2: 0 2px 8px -2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    --elev-3: 0 8px 20px -6px rgba(0, 0, 0, 0.4), 0 24px 48px -20px rgba(0, 0, 0, 0.6);
    --shadow-card: var(--elev-2);
  }
}

html[data-theme="light"] {
  --paper: #f8f4ea; --paper-raised: #ffffff; --paper-sunken: #f0eadb;
  --rule: #e3dac4; --rule-strong: #cdbe9d;
  --ink: #1c1712; --ink-soft: #6b6255; --ink-faint: #a89d88;
  --gold: #a97f34; --gold-deep: #6b5223; --gold-glow: #e8c988;
  --gold-tint: rgba(169, 127, 52, 0.1); --gold-line: rgba(169, 127, 52, 0.32);
  --good: #337a4c; --good-glow: #7bd39a; --good-bg: #e1efe4;
  --bad: #ad3d30; --bad-glow: #f0857a; --bad-bg: #f5e2df;
  --glass-surface: rgba(255, 255, 255, 0.6);
  --glass-surface-strong: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --elev-1: 0 1px 2px rgba(28, 23, 18, 0.05), 0 1px 1px rgba(28, 23, 18, 0.04);
  --elev-2: 0 2px 8px -2px rgba(28, 23, 18, 0.10), 0 8px 24px -12px rgba(28, 23, 18, 0.14);
  --elev-3: 0 8px 20px -6px rgba(28, 23, 18, 0.16), 0 24px 48px -20px rgba(28, 23, 18, 0.22);
  --shadow-card: var(--elev-2);
}

html[data-theme="dark"] {
  --paper: #100e0a; --bg: #100e0a; --paper-raised: #1c1912; --paper-sunken: #0a0906;
  --rule: #2a2620; --rule-strong: #3a342a;
  --ink: #f2ede2; --ink-soft: #a89d88; --ink-faint: #6b6255;
  --gold: #d4ab63; --gold-deep: #e8c988; --gold-glow: #f4dca0;
  --gold-tint: rgba(212, 171, 99, 0.14); --gold-line: rgba(212, 171, 99, 0.32);
  --good: #7bd39a; --good-glow: #7bd39a; --good-bg: rgba(63, 110, 74, 0.2);
  --bad: #e0897c; --bad-glow: #e0897c; --bad-bg: rgba(161, 63, 52, 0.2);
  --glass-surface: rgba(35, 31, 23, 0.55);
  --glass-surface-strong: rgba(40, 36, 27, 0.72);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.12);
  --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --elev-2: 0 2px 8px -2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  --elev-3: 0 8px 20px -6px rgba(0, 0, 0, 0.4), 0 24px 48px -20px rgba(0, 0, 0, 0.6);
  --shadow-card: var(--elev-2);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html {
  font-family: var(--font-sans);
  background-color: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  touch-action: pan-y;
}

body {
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  background:
    radial-gradient(680px 420px at 18% -6%, var(--gold-tint), transparent 60%),
    radial-gradient(520px 360px at 100% 18%, rgba(63, 122, 76, 0.06), transparent 65%),
    var(--paper);
}
input, select { user-select: auto; -webkit-user-select: auto; }
button, input, select { font-family: inherit; color: inherit; border: none; background: none; outline: none; }

.num, td, .amount { font-variant-numeric: tabular-nums lining-nums; }

.app {
  width: 100%;
  max-width: 600px;
  padding: calc(20px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
}

.masthead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding-bottom: 10px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.brand-badge {
  width: 30px;
  height: 30px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--gold-glow), var(--gold) 55%, var(--gold-deep));
  color: #ffffff;
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(169, 127, 52, 0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  flex-shrink: 0;
}

.masthead-title {
  font-family: var(--font-display);
  font-size: clamp(18px, 5vw, 26px);
  font-weight: 600;
  font-style: italic;
  letter-spacing: -0.01em;
  color: var(--ink);
  line-height: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.masthead-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  background: var(--glass-surface);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-full);
  font-size: var(--fs-xs2);
  font-weight: 600;
  color: var(--ink-soft);
  white-space: nowrap;
  max-width: 118px;
  flex-shrink: 1;
  min-width: 0;
  box-shadow: var(--elev-1);
}
.status-pill span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; animation: pulse-ring 2s infinite; box-shadow: 0 0 6px var(--good-glow); }
.status-pill .ae-fresh-dot,
.status-pill > span:not(.status-dot):not(#statusText) { display: none !important; }
.status-pill.offline .status-dot { background: var(--bad); animation: none; box-shadow: 0 0 6px var(--bad-glow); }
.status-pill.syncing .status-dot { background: var(--gold); animation: spin 0.8s linear infinite; border-radius: 1px; }

@keyframes pulse-ring { 0% { transform: scale(0.9); opacity: 0.75; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.75; } }
@keyframes spin { to { transform: rotate(360deg); } }

.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; flex-shrink: 0;
  background: var(--glass-surface);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border); border-radius: 50%;
  color: var(--ink-soft); cursor: pointer; transition: all var(--transition);
  box-shadow: var(--elev-1);
}
.theme-toggle:active { transform: scale(0.9); background: var(--paper-sunken); }
.theme-toggle svg { width: 13px; height: 13px; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

.health-collapsible {
  background: var(--glass-surface);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--elev-1);
}
.health-collapsible summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  list-style: none;
  user-select: none;
}
.health-collapsible summary::-webkit-details-marker { display: none; }
.health-summary-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding-right: 10px;
}
.health-summary-left { display: flex; align-items: center; gap: 8px; }
.feed-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; box-shadow: 0 0 6px var(--good-glow); }
.health-collapsible.status-stale .feed-dot { background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
.health-collapsible.status-disagreeing .feed-dot { background: var(--bad); box-shadow: 0 0 6px var(--bad-glow); }
.health-title { font-size: var(--fs-base); font-weight: 700; color: var(--ink); }
.health-badge {
  font-size: var(--fs-2xs);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: var(--r-full);
  background: var(--good-bg);
  color: var(--good);
}
.health-collapsible.status-stale .health-badge { background: var(--gold-tint); color: var(--gold-deep); }
.health-collapsible.status-disagreeing .health-badge { background: var(--bad-bg); color: var(--bad); }
.health-collapsible .collapsible-content {
  padding: 10px 14px;
  border-top: 1px dashed var(--rule);
  font-size: var(--fs-sm2);
  color: var(--ink-soft);
  line-height: 1.45;
  background: transparent;
}

.notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 15px;
  border: 1px solid var(--bad);
  border-left-width: 3px;
  border-radius: var(--r-md);
  color: var(--bad);
  background: var(--bad-bg);
  width: 100%;
  cursor: pointer;
}
.notice[hidden] { display: none !important; }
.notice.notice-gold { border-color: var(--gold-line); background: var(--gold-tint); color: var(--gold-deep); cursor: default; }
.notice-body { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.notice-body strong { font-size: var(--fs-base2); font-weight: 700; display: flex; justify-content: space-between; }
.notice-body p { font-size: var(--fs-sm2); font-weight: 500; line-height: 1.4; color: var(--ink-soft); }
.notice-dismiss { font-size: var(--fs-2xs); opacity: 0.75; font-weight: 600; }

.hero {
  background:
    radial-gradient(120% 140% at 50% -10%, var(--gold-tint), transparent 60%),
    var(--glass-surface-strong);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  padding: 46px 22px 22px;
  box-shadow: var(--elev-3), inset 0 1px 0 var(--glass-highlight);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  top: -60%; left: 50%;
  width: 140%; height: 140%;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, var(--gold-glow), transparent 70%);
  opacity: 0.16;
  pointer-events: none;
  filter: blur(10px);
}
.hero-top-row {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  position: relative;
}
.hero-eyebrow {
  font-family: var(--font-display);
  font-style: italic;
  font-size: var(--fs-md2);
  font-weight: 440;
  color: var(--gold-deep);
  position: relative;
}
.hero-price {
  font-family: var(--font-display);
  font-size: clamp(44px, 12vw, 66px);
  font-weight: 680;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 0.14em;
  width: 100%;
  position: relative;
}
.hero-rule { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--rule-strong), transparent); margin: 2px 0; position: relative; }
.hero-foot { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 16px; position: relative; }
.hero-foot-col { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; text-align: left; }
.hero-foot-col:last-child { text-align: right; }
.hero-foot-label { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-faint); letter-spacing: 0.01em; line-height: 1.2; }
.hero-foot-val { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; line-height: 1.2; }
.hero-foot-col:last-child .hero-foot-val { justify-content: flex-end; }
#hero1.hero-foot-val { font-size: var(--fs-xl2); }
.hero-foot-sub { font-size: var(--fs-xs2); font-weight: 500; color: var(--ink-soft); line-height: 1.2; }

.share-link {
  position: absolute;
  right: 0;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-soft);
  cursor: pointer; padding: 6px 10px;
  background: var(--glass-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-full);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  transition: transform var(--transition), background var(--transition);
  z-index: 10;
}
.share-link:active { transform: scale(0.94); }
.share-link-inline {
  position: static;
  width: 100%;
  height: 44px;
  margin-top: 12px;
  justify-content: center;
  font-size: var(--fs-base2);
  padding: 6px 10px;
  box-sizing: border-box;
}

.section { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; }
.section-head h3 {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  font-style: italic;
  color: var(--ink);
}
.section-head span { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-faint); }

.panel {
  background: var(--glass-surface);
  backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  width: 100%;
  box-shadow: var(--elev-1);
}

.purity-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: 100%;
}
.purity-cell {
  display: flex; flex-direction: column; gap: 3px;
  padding: 10px 10px;
  border-right: 1px solid var(--rule);
  text-align: center;
}
.purity-cell:last-child { border-right: none; }
.purity-cell small { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-faint); }
.purity-cell b { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; color: var(--ink); }

.ledger { display: flex; flex-direction: column; width: 100%; }
.ledger-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 2px;
  border-bottom: 1px solid var(--rule);
  gap: 12px;
}
.ledger-row:last-child { border-bottom: none; }
.ledger-key { font-size: var(--fs-base); font-weight: 500; color: var(--ink-soft); flex-shrink: 0; }
.ledger-val { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; color: var(--ink); text-align: right; }
.ledger-val-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.ledger-val-stack small { font-size: var(--fs-xs); font-weight: 500; color: var(--ink-soft); }

.timeline-horizontal { display: grid; grid-template-columns: 1fr 1fr; gap: 0; width: 100%; }
.timeline-card {
  padding: 10px 14px;
  display: flex; flex-direction: column; gap: 4px;
  border-right: 1px solid var(--rule);
  border-radius: var(--r-sm);
  transition: background var(--transition);
}
.timeline-card:last-child { border-right: none; }
.timeline-card-header { display: flex; align-items: center; justify-content: space-between; }
.timeline-card-header .lbl { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-faint); }
.timeline-node { width: 7px; height: 7px; border-radius: 50%; background: var(--rule-strong); flex-shrink: 0; }
.timeline-card.is-active .timeline-node { background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
.timeline-card b { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; color: var(--ink); }
.timeline-card small { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-soft); }
.next-fix-line { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 10px 14px 0; border-top: 1px solid var(--rule); font-size: var(--fs-sm); font-weight: 500; color: var(--ink-faint); }
.next-fix-line[hidden] { display: none !important; }
.next-fix-line svg { width: 12px; height: 12px; flex-shrink: 0; }

.chart-panel { display: flex; flex-direction: column; gap: 14px; }
