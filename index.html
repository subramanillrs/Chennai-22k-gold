<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">

<title>Gold Price 22K</title>

<style>
:root {
  color-scheme: light dark;

  /* ---- Core Colors (Light Mode Default) ---- */
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-hover: #f8f9fa;
  
  --text-main: #111827;
  --text-muted: #6b7280;
  
  --border: #e5e7eb;
  --border-highlight: #d1d5db;

  /* ---- Gold & Accents ---- */
  --gold-primary: #d97706; 
  --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  --gold-light: #fef3c7;
  
  --good: #10b981;
  --good-bg: #d1fae5;
  --bad: #ef4444;
  --bad-bg: #fee2e2;

  /* ---- Layout & Shapes ---- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 999px;
  
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
  
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --surface-hover: #27272a;
    
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    
    --border: #27272a;
    --border-highlight: #3f3f46;

    --gold-primary: #fbbf24;
    --gold-gradient: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
    --gold-light: #45320a;

    --good: #34d399;
    --good-bg: #064e3b;
    --bad: #f87171;
    --bad-bg: #7f1d1d;
    
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.5);
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

button, input, select {
  font: inherit;
  color: inherit;
  outline: none;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  transition: all var(--transition);
}

.app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));
}

/* =========================================================
   TOP BAR & STATUS
   ========================================================= */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.brand h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.brand p {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 3px var(--good-bg);
  animation: pulse 2s infinite;
}
