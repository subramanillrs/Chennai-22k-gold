name: Update gold price

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current 22K rate
        run: |
          curl -fsSL "https://api.goldprice.dev/v1/carat?currency=INR" -o /tmp/rates.json

          python - <<'PY'
          import json
          import datetime
          from pathlib import Path

          src = json.loads(Path("/tmp/rates.json").read_text())

          value = float(src["price_gram_22k"])
          timestamp = src["timestamp"]

          dt = datetime.datetime.fromisoformat(
              timestamp.replace("Z", "+00:00")
          )

          date = dt.strftime("%d %b %Y")

          path = Path("data.json")

          if path.exists():
              data = json.loads(path.read_text())
          else:
              data = {"history": []}

          history = data.get("history", [])

          if not history or history[-1].get("ts") != timestamp:
              history.append({
                  "d": date,
                  "v": value,
                  "ts": timestamp
              })

              data["history"] = history[-365:]

              path.write_text(
                  json.dumps(data, indent=2) + "\n"
              )

              print("Saved:", value)
          else:
              print("No new observation.")

          PY

      - name: Commit updated price
        run: |
          if git diff --quiet -- data.json; then
            echo "No price change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git commit -m "Update 22K gold price"
          git push
