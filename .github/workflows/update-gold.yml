name: Update 22K Gold Rate

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch free 22K rate
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://api.goldprice.dev/v1/carat?currency=INR"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "22K-Gold-Tracker/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          rate = float(data["price_gram_22k"])
          rate24 = float(data["price_gram_24k"])

          timestamp = data.get(
              "timestamp",
              datetime.now(timezone.utc).isoformat()
          )

          output = {
              "rate_22k": round(rate, 2),
              "rate_24k": round(rate24, 2),
              "unit": "INR/g",
              "updated_at": timestamp,
              "source": "GoldPrice.dev"
          }

          with open("data/live.json", "w") as f:
              json.dump(output, f, indent=2)
          PY

      - name: Commit updated rate
        run: |
          git config user.name "22K Gold Tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Update 22K gold rate"
          git push
