name: Update Chennai 22K Gold Rate

on:
  schedule:
    # 11:00 AM IST
    - cron: "30 5 * * *"

    # 5:00 PM IST
    - cron: "30 11 * * *"

  workflow_dispatch:

# Prevent two monitoring runs from running at the same time.
concurrency:
  group: chennai-22k-gold-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    # Absolute safety limit for the entire job.
    # 400 checks × 10 seconds ≈ 66 minutes 40 seconds.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Monitor and update Chennai 22K rate
        run: |
          python update_gold.py

      - name: Verify generated data
        run: |
          echo "Checking generated data files..."

          if [ ! -f data/live.json ]; then
            echo "ERROR: data/live.json was not created."
            exit 1
          fi

          if [ ! -f data/history.json ]; then
            echo "ERROR: data/history.json was not created."
            exit 1
          fi

          echo "data/live.json exists."
          echo "data/history.json exists."

      - name: Show current live data
        run: |
          echo "Current live.json:"
          cat data/live.json

      - name: Save updated data
        run: |
          git config user.name "Chennai 22K Gold Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Chennai 22K gold rate"
            git push
          fi
