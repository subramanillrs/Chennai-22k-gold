name: Update Chennai 22K Gold Rate

on:
  schedule:
    # Broad morning and evening launch points.
    # The Python program decides whether the learned window
    # is active and performs the 10-second intensive polling.
    - cron: "30 4 * * *"   # 10:00 AM IST
    - cron: "30 10 * * *"  # 4:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Monitor and update Chennai 22K rate
        run: python update_gold.py

      - name: Verify generated data
        run: |
          echo "Checking generated data files..."
          test -f data/live.json || { echo "ERROR: data/live.json was not created."; exit 1; }
          test -f data/history.json || { echo "ERROR: data/history.json was not created."; exit 1; }
          echo "Generated data files are present."

      - name: Show current live data
        run: |
          echo "Current live data:"
          cat data/live.json

      - name: Save updated data
        run: |
          git config user.name "Chennai 22K Gold Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/live.json data/history.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Chennai 22K gold rate"
            git push
          fi
