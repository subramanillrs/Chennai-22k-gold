name: Update Chennai 22K Gold Rate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Chennai 22K rate
        shell: python
        run: |
          import json
          import re
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          url = "https://www.livechennai.com/gold_silverrate.asp"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          html = urllib.request.urlopen(
              request,
              timeout=30
          ).read().decode("utf-8", "ignore")

          patterns = [
              r'1\s*Gm\s*\(22\s*K\).*?(\d[\d,]+)\s*\(',
              r'22\s*K.*?1\s*Gm.*?(\d[\d,]+)'
          ]

          rate = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  html,
                  re.IGNORECASE | re.DOTALL
              )

              if match:
                  value = int(
                      match.group(1).replace(",", "")
                  )

                  if 5000 <= value <= 30000:
                      rate = value
                      break

          if rate is None:
              raise Exception(
                  "Could not find Chennai 22K rate"
              )

          now = datetime.now(
              ZoneInfo("Asia/Kolkata")
          )

          output = {
              "rate_22k": rate,
              "eight_22k": rate * 8,
              "rate_24k": None,
              "rate_18k": None,
              "updated_at": now.isoformat(),
              "source": "LiveChennai",
              "source_url": url,
              "session": (
                  "AM"
                  if now.hour < 13
                  else "PM"
              )
          }

          with open(
              "data/live.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2
              )

      - name: Save updated rate
        run: |
          git config user.name "Chennai 22K Gold Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/live.json

          git diff --cached --quiet || \
            git commit -m "Update Chennai 22K gold rate"

          git push
