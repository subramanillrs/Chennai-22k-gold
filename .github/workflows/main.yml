<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#fffbff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130e" media="(prefers-color-scheme: dark)">
<meta name="description" content="Chennai 22K gold price tracker">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold price 22k">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">

<title>Gold price 22k</title>

<style>
:root {
  color-scheme: light;

  /* ---- Material shape scale ---- */
  --shape-xs: 8px;
  --shape-sm: 12px;
  --shape-md: 16px;
  --shape-lg: 20px;
  --shape-xl: 28px;
  --shape-full: 999px;

  /* ---- Motion ---- */
  --ease-standard: cubic-bezier(.2,0,0,1);
  --ease-emphasized: cubic-bezier(.3,0,.1,1);

  /* ---- Surfaces (tonal, warm-neutral) ---- */
  --bg: #fffbff;
  --surface: #fffbff;
  --surface-dim: #e0d9cd;
  --surface-bright: #fffbff;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #faf3e7;
  --surface-container: #f4ede1;
  --surface-container-high: #eee7db;
  --surface-container-highest: #e8e1d6;

  --outline: #837567;
  --outline-variant: #d5c7b6;

  --on-surface: #1d1b16;
  --on-surface-variant: #4d4639;

  /* ---- Primary (gold) ---- */
  --primary: #7c5900;
  --on-primary: #ffffff;
  --primary-container: #ffdea0;
  --on-primary-container: #271900;

  /* ---- Secondary ---- */
  --secondary-container: #efe0c3;
  --on-secondary-container: #4c4526;

  /* ---- Tertiary / inverse (used for dark hero + FAB) ---- */
  --inverse-surface: #322f27;
  --inverse-on-surface: #f6efe4;
  --inverse-primary: #ffbf5f;

  /* ---- Semantic ---- */
  --good: #2e6e4e;
  --good-container: #b6f2cc;
  --on-good-container: #002110;

  --bad: #ba1a1a;
  --bad-container: #ffdad6;
  --on-bad-container: #410002;

  /* ---- Elevation (subtle, M3-style) ---- */
  --el1: 0 1px 2px rgba(29,27,22,.10), 0 1px 3px 1px rgba(29,27,22,.06);
  --el2: 0 1px 2px rgba(29,27,22,.12), 0 2px 6px 2px rgba(29,27,22,.08);
  --el3: 0 1px 3px rgba(29,27,22,.14), 0 4px 8px 3px rgba(29,27,22,.10);
  --el4: 0 2px 3px rgba(29,27,22,.16), 0 6px 10px 4px rgba(29,27,22,.10);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
  overscroll-behavior-y: contain;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--on-surface);
  overscroll-behavior-y: contain;

  font-family:
    "Google Sans Text",
    Roboto,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  overflow: hidden;
}

/* Shared Material "state layer" press feedback */
button::after {
  content: "";
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  transition: opacity .12s var(--ease-standard);
  pointer-events: none;
}

button:active::after {
  opacity: .10;
}

.app {
  width: 100%;
  max-width: 820px;
  margin: auto;

  padding:
    calc(12px + env(safe-area-inset-top))
    16px
    calc(96px + env(safe-area-inset-bottom));
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
  min-height: 64px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 42px;
  height: 42px;

  border-radius: var(--shape-md);

  display: grid;
  place-items: center;

  background: var(--primary-container);
  color: var(--on-primary-container);

  font-size: 18px;
  font-weight: 700;
}

.brand h1 {
  margin: 0;

  font-size: 17px;
  line-height: 1.25;
  font-weight: 600;

  letter-spacing: 0;
}

.brand p {
  margin: 2px 0 0;

  color: var(--on-surface-variant);

  font-size: 12.5px;
  font-weight: 500;
}

.iconbtn {
  width: 50px;
  height: 50px;

  border: none;
  border-radius: var(--shape-full);

  background: var(--primary-container);
  color: var(--on-primary-container);

  font-size: 21px;

  box-shadow: var(--el1);

  transition: background .2s var(--ease-standard), transform .15s var(--ease-standard), box-shadow .2s var(--ease-standard);
}

.iconbtn:active {
  transform: scale(.92);
}

.iconbtn:hover {
  box-shadow: var(--el2);
}

.iconbtn.spin {
  animation: spin .5s var(--ease-emphasized);
}

.iconbtn.fetching {
  animation: spin .75s linear infinite;
  pointer-events: none;
}

.fab {
  position: fixed;

  right: 20px;
  bottom: calc(20px + env(safe-area-inset-bottom));

  width: 60px;
  height: 60px;

  font-size: 24px;

  box-shadow: var(--el3);

  z-index: 30;
}

.fab:hover {
  box-shadow: var(--el4);
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================================================
   STATUS
   ========================================================= */

.status {
  display: flex;
  align-items: center;
  gap: 8px;

  margin: 14px 4px 14px;

  color: var(--on-surface-variant);

  font-size: 12.5px;
  font-weight: 500;
}

.dot {
  width: 8px;
  height: 8px;

  flex: none;

  border-radius: 50%;

  background: var(--good);

  box-shadow: 0 0 0 4px var(--good-container);

  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: .4;
  }
}

.offline .dot {
  background: var(--bad);
  box-shadow: 0 0 0 4px var(--bad-container);
  animation: none;
}

/* =========================================================
   PULL TO REFRESH
   ========================================================= */

.pulldown {
  position: fixed;

  left: 50%;
  top: calc(10px + env(safe-area-inset-top));

  transform: translate(-50%,-70px);

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 10px 18px;

  border-radius: var(--shape-full);

  background: var(--inverse-surface);
  color: var(--inverse-on-surface);

  box-shadow: var(--el3);

  font-size: 12.5px;
  font-weight: 600;

  opacity: 0;

  pointer-events: none;

  transition: transform .2s var(--ease-emphasized), opacity .2s var(--ease-standard);

  z-index: 21;

  white-space: nowrap;
}

.pulldown.visible {
  opacity: 1;
}

.pulldown .pulldownicon {
  display: inline-flex;
  font-size: 15px;

  transition: transform .15s var(--ease-standard);
}

.pulldown.ready .pulldownicon {
  transform: rotate(180deg);
  color: var(--inverse-primary);
}

.pulldown.loading .pulldownicon {
  animation: spin .75s linear infinite;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
  position: relative;
  overflow: hidden;

  padding: 28px 24px;

  border-radius: var(--shape-xl);

  background: var(--inverse-surface);

  box-shadow: var(--el2);
}

.hero::after {
  content: "22K";

  position: absolute;

  right: -10px;
  bottom: -46px;

  font-size: 145px;
  line-height: 1;

  font-weight: 700;
  font-style: italic;

  color: rgba(255,255,255,.035);

  pointer-events: none;
}

.eyebrow {
  position: relative;
  z-index: 1;

  color: var(--inverse-primary);

  font-size: 11.5px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 1.1px;
}

.hero h2 {
  position: relative;
  z-index: 1;

  margin: 10px 0 0;

  font-size: clamp(42px,11.5vw,68px);
  line-height: 1;

  letter-spacing: -1.5px;

  font-weight: 600;

  color: var(--inverse-on-surface);

  font-variant-numeric: tabular-nums;
}

.hero .unit {
  position: relative;
  z-index: 1;

  margin-top: 8px;

  color: rgba(246,239,228,.55);

  font-size: 12.5px;
  font-weight: 500;
}

.sovereign {
  position: relative;
  z-index: 1;

  margin-top: 20px;
  padding-top: 18px;

  border-top: 1px solid rgba(246,239,228,.14);
}

.sovereign label {
  display: block;

  color: rgba(246,239,228,.55);

  font-size: 11px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .7px;
}

.sovereign strong {
  display: block;

  margin-top: 4px;

  font-size: clamp(28px,7.5vw,42px);

  letter-spacing: -.8px;

  font-weight: 600;

  color: var(--inverse-on-surface);

  font-variant-numeric: tabular-nums;
}

.change {
  position: relative;
  z-index: 1;

  display: inline-flex;
  align-items: center;

  margin-top: 16px;
  padding: 8px 14px;

  border-radius: var(--shape-full);

  font-size: 12.5px;
  font-weight: 700;
}

.up {
  color: var(--on-good-container);
  background: var(--good-container);
}

.down {
  color: var(--on-bad-container);
  background: var(--bad-container);
}

.same {
  color: rgba(246,239,228,.7);
  background: rgba(246,239,228,.12);
}

/* =========================================================
   FETCH  (Material filled button)
   ========================================================= */

.fetchrow {
  margin-top: 12px;
}

.fetchbtn {
  width: 100%;
  min-height: 56px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  border: 0;
  border-radius: var(--shape-full);

  background: var(--primary);
  color: var(--on-primary);

  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: .1px;

  box-shadow: var(--el1);

  transition:
    box-shadow .2s var(--ease-standard),
    opacity .2s var(--ease-standard);
}

.fetchbtn:hover {
  box-shadow: var(--el2);
}

.fetchbtn:disabled {
  opacity: .6;
  cursor: wait;
}

.fetchicon {
  font-size: 19px;
}

.fetching .fetchicon {
  animation: spin .75s linear infinite;
}

.fetchnote {
  margin: 10px 8px 0;

  color: var(--on-surface-variant);

  text-align: center;

  font-size: 11.5px;
  line-height: 1.5;
}

/* =========================================================
   QUICK CARDS
   ========================================================= */

.quick {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;

  margin-top: 14px;
}

.card {
  padding: 16px;

  background: var(--surface-container-low);

  border-radius: var(--shape-lg);

  transition: background .2s var(--ease-standard);
}

.label {
  color: var(--on-surface-variant);

  font-size: 10.5px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .6px;
}

.value {
  margin-top: 7px;

  font-size: 18px;
  font-weight: 700;

  letter-spacing: -.1px;

  font-variant-numeric: tabular-nums;
}

.sub {
  margin-top: 4px;

  color: var(--on-surface-variant);

  font-size: 11.5px;
}

/* =========================================================
   SECTIONS
   ========================================================= */

.section {
  margin-top: 32px;
}

.sectionhead {
  display: flex;
  align-items: end;
  justify-content: space-between;

  gap: 10px;

  margin: 0 4px 12px;
}

.sectionhead h3 {
  margin: 0;

  font-size: 17px;
  font-weight: 600;

  letter-spacing: 0;
}

.sectionhead span {
  color: var(--on-surface-variant);
  font-size: 11.5px;
  font-weight: 500;
}

/* =========================================================
   SEGMENTS  (Material segmented button)
   ========================================================= */

.segment {
  display: flex;
  gap: 4px;

  overflow: auto;

  padding: 4px;
  margin: 2px 0 8px;

  background: var(--surface-container);
  border-radius: var(--shape-full);

  scrollbar-width: none;
}

.segment::-webkit-scrollbar {
  display: none;
}

.segment button {
  white-space: nowrap;

  padding: 9px 16px;

  border: none;
  border-radius: var(--shape-full);

  background: transparent;

  color: var(--on-surface-variant);

  font-size: 12.5px;
  font-weight: 600;

  transition: background .2s var(--ease-standard), color .2s var(--ease-standard);
}

.segment button.active {
  background: var(--surface-container-lowest);
  color: var(--primary);
  box-shadow: var(--el1);
}

/* =========================================================
   PANEL
   ========================================================= */

.panel {
  padding: 16px;

  background: var(--surface-container-low);

  border-radius: var(--shape-lg);
}

/* =========================================================
   METRICS
   ========================================================= */

.metricrow {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;

  margin-bottom: 14px;
}

.metric {
  padding: 13px;

  border-radius: var(--shape-md);

  background: var(--surface-container);
}

.metric small {
  color: var(--on-surface-variant);
  font-size: 10px;
  font-weight: 600;
}

.metric b {
  display: block;

  margin-top: 5px;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: -.1px;

  font-variant-numeric: tabular-nums;
}

/* =========================================================
   CHART
   ========================================================= */

.chartwrap {
  height: 280px;
  position: relative;
}

.chartwrap canvas {
  width: 100%;
  height: 100%;

  display: block;

  touch-action: none;
}

.chartmeta {
  display: flex;
  justify-content: space-between;

  margin-top: 8px;

  color: var(--on-surface-variant);

  font-size: 10.5px;
  font-weight: 500;
}

/* =========================================================
   TODAY
   ========================================================= */

.todaygrid {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.session {
  padding: 16px;

  background: var(--surface-container);

  border-radius: var(--shape-md);
}

.session .tag {
  color: var(--on-surface-variant);

  font-size: 10px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .5px;
}

.session .rate {
  margin-top: 8px;

  font-size: 19px;
  font-weight: 700;

  letter-spacing: -.2px;

  font-variant-numeric: tabular-nums;
}

.session .time {
  margin-top: 4px;

  color: var(--on-surface-variant);

  font-size: 11px;
}

/* =========================================================
   LAST CHANGE
   ========================================================= */

.last {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.last .when {
  font-weight: 600;
  font-size: 13.5px;
}

.last .when small {
  display: block;

  margin-top: 4px;

  color: var(--on-surface-variant);

  font-size: 11px;
  font-weight: 500;
}

.last .amount {
  font-size: 18px;
  font-weight: 700;

  letter-spacing: -.2px;

  text-align: right;

  font-variant-numeric: tabular-nums;
}

.positive {
  color: var(--good);
}

.negative {
  color: var(--bad);
}

/* =========================================================
   FORMS  (Material filled text field)
   ========================================================= */

.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.field label {
  display: block;

  margin-bottom: 7px;

  color: var(--on-surface-variant);

  font-size: 11px;
  font-weight: 600;
}

.field input,
.field select {
  width: 100%;
  height: 50px;

  padding: 0 14px;

  border: none;
  border-bottom: 2px solid var(--outline-variant);
  border-radius: var(--shape-xs) var(--shape-xs) 4px 4px;

  background: var(--surface-container-highest);
  color: var(--on-surface);

  outline: 0;

  transition: border-color .15s var(--ease-standard), background .15s var(--ease-standard);
}

.field input:focus,
.field select:focus {
  border-color: var(--primary);
  background: var(--surface-container-high);
}

.result {
  margin-top: 13px;

  padding: 16px;

  border-radius: var(--shape-md);

  background: var(--primary-container);
}

.result b {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.2px;
  font-variant-numeric: tabular-nums;
  color: var(--on-primary-container);
}

.result p {
  margin: 5px 0 0;

  color: var(--on-primary-container);
  opacity: .75;

  font-size: 11px;
}

/* =========================================================
   COMPARE
   ========================================================= */

.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.compareResult {
  margin-top: 11px;

  padding: 16px;

  border-radius: var(--shape-md);

  background: var(--secondary-container);
}

.compareResult strong {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.2px;
  color: var(--on-secondary-container);
}

/* =========================================================
   HISTORY
   ========================================================= */

.tablewrap {
  max-height: 420px;

  overflow: auto;

  border-radius: var(--shape-md);
}

.history {
  width: 100%;

  border-collapse: collapse;

  font-size: 12px;
}

.history th {
  position: sticky;
  top: 0;

  z-index: 1;

  padding: 12px;

  background: var(--surface-container-high);

  color: var(--on-surface-variant);

  font-size: 10px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .4px;

  text-align: left;
}

.history td {
  padding: 12px;

  border-top: 1px solid var(--outline-variant);

  font-weight: 600;

  font-variant-numeric: tabular-nums;
}

.history tbody tr:active td {
  background: var(--surface-container);
}

.history td:last-child,
.history th:last-child {
  text-align: right;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer {
  padding: 30px 8px 8px;

  color: var(--on-surface-variant);

  font-size: 10.5px;

  line-height: 1.7;

  text-align: center;
}

/* =========================================================
   TOAST  (Material snackbar)
   ========================================================= */

.toast {
  position: fixed;

  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom));

  transform: translate(-50%,16px);

  padding: 13px 18px;

  border-radius: var(--shape-xs);

  background: var(--inverse-surface);
  color: var(--inverse-on-surface);

  font-size: 12.5px;
  font-weight: 500;

  box-shadow: var(--el3);

  opacity: 0;

  pointer-events: none;

  transition: opacity .2s var(--ease-standard), transform .2s var(--ease-emphasized);

  z-index: 20;

  white-space: nowrap;
}

.toast.show {
  opacity: 1;

  transform: translate(-50%,0);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width:650px) {

  .quick {
    grid-template-columns: repeat(4,1fr);
  }

  .hero {
    padding: 32px;
  }
}

@media (max-width:430px) {

  .app {
    padding-left: 12px;
    padding-right: 12px;
  }

  .hero {
    padding: 22px;
  }

  .chartwrap {
    height: 245px;
  }

  .metric {
    padding: 11px 9px;
  }
}

/* =========================================================
   DARK MODE
   ========================================================= */

@media (prefers-color-scheme:dark) {

  :root {
    color-scheme: dark;

    --bg: #15130e;
    --surface: #15130e;
    --surface-dim: #15130e;
    --surface-bright: #3c3830;
    --surface-container-lowest: #100e09;
    --surface-container-low: #1d1b15;
    --surface-container: #211e18;
    --surface-container-high: #2c2922;
    --surface-container-highest: #37332c;

    --outline: #a08d78;
    --outline-variant: #504636;

    --on-surface: #e9e1d4;
    --on-surface-variant: #d1c5b3;

    --primary: #ffbf5f;
    --on-primary: #422d00;
    --primary-container: #5e4200;
    --on-primary-container: #ffdea0;

    --secondary-container: #4c4526;
    --on-secondary-container: #efe0c3;

    --inverse-surface: #e9e1d4;
    --inverse-on-surface: #322f27;
    --inverse-primary: #7c5900;

    --good: #92d5ac;
    --good-container: #0e5233;
    --on-good-container: #b6f2cc;

    --bad: #ffb4a9;
    --bad-container: #93000a;
    --on-bad-container: #ffdad6;

    --el1: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.28);
    --el2: 0 1px 2px rgba(0,0,0,.42), 0 2px 6px 2px rgba(0,0,0,.30);
    --el3: 0 1px 3px rgba(0,0,0,.44), 0 4px 8px 3px rgba(0,0,0,.32);
    --el4: 0 2px 3px rgba(0,0,0,.46), 0 6px 10px 4px rgba(0,0,0,.32);
  }

  .hero {
    background: var(--surface-container-high);
    border: 1px solid var(--outline-variant);
  }

  .hero .eyebrow {
    color: var(--primary);
  }

  .hero h2,
  .sovereign strong {
    color: var(--on-surface);
  }

  .hero .unit,
  .sovereign label {
    color: var(--on-surface-variant);
  }

  .sovereign {
    border-top-color: var(--outline-variant);
  }
}
</style>
</head>

<body>

<div class="app">

<div
