<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/*
 * GitHub Pages JSON files
 */
const LIVE_URL = "data/live.json";
const HISTORY_URL = "data/history.json";


/*
 * YOUR CLOUDFLARE WORKER
 *
 * IMPORTANT:
 * The Worker requires POST.
 */
const WORKER_URL =
  "https://gold-price-fetch.subramanilrs.workers.dev/";


let live = null;
let history = [];

let selectedRange = 30;

let fetchBusy = false;


/* =========================================================
   HELPER
   ========================================================= */

const $ = id =>
  document.getElementById(id);


const money = n => {

  const value = Number(n);

  return Number.isFinite(value)
    ? "₹" +
      Math.round(value)
        .toLocaleString("en-IN")
    : "₹—";
};


const dateText = s => {

  if (!s) {
    return "—";
  }

  const d =
    new Date(
      String(s) + "T00:00:00"
    );

  if (isNaN(d.getTime())) {
    return String(s);
  }

  return d.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );
};


const timeText = s => {

  if (!s) {
    return "—";
  }

  const parts =
    String(s).split(":");

  if (parts.length < 2) {
    return String(s);
  }

  let hour =
    Number(parts[0]);

  const minute =
    parts[1];

  if (!Number.isFinite(hour)) {
    return String(s);
  }

  const ap =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12 || 12;

  return (
    hour +
    ":" +
    minute +
    " " +
    ap
  );
};


const esc = s =>
  String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");


function setStatus(
  text,
  offline = false
) {

  $("statusText")
    .textContent = text;

  $("status")
    .classList
    .toggle(
      "offline",
      offline
    );
}


function toast(text) {

  $("toast")
    .textContent = text;

  $("toast")
    .classList
    .add("show");

  setTimeout(
    () => {

      $("toast")
        .classList
        .remove("show");

    },
    2200
  );
}


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


/* =========================================================
   GET JSON
   ========================================================= */

async function getJSON(url) {

  const separator =
    url.includes("?")
      ? "&"
      : "?";

  const response =
    await fetch(
      url +
      separator +
      "v=" +
      Date.now(),
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );
  }

  return response.json();
}


/* =========================================================
   NORMALIZE HISTORY
   ========================================================= */

function normalize(array) {

  if (!Array.isArray(array)) {
    return [];
  }

  return array

    .filter(
      item =>
        item &&
        item.date &&
        Number.isFinite(
          Number(item.rate_22k)
        )
    )

    .map(
      item => ({
        ...item,

        rate_22k:
          Number(item.rate_22k)
      })
    )

    .sort(
      (a,b) =>
        String(a.date)
          .localeCompare(
            String(b.date)
          )
    );
}


/* =========================================================
   RENDER LIVE DATA
   ========================================================= */

function renderLive(d) {

  if (!d) {
    return;
  }

  live = d;


  const rate =
    Number(d.rate_22k);


  const rate8 =
    Number.isFinite(
      Number(d.rate_8g)
    )
      ? Number(d.rate_8g)
      : rate * 8;


  $("hero8")
    .textContent =
      money(rate8);


  $("hero1")
    .textContent =
      money(rate);


  $("today")
    .textContent =
      dateText(d.date);


  $("todayTime")
    .textContent =
      timeText(d.time);


  $("session")
    .textContent =
      d.session || "—";


  let change =
    Number(d.change);


  if (!Number.isFinite(change)) {

    const previous =
      Number(
        d.previous_rate_22k
      );

    change =
      Number.isFinite(previous)
        ? rate - previous
        : 0;
  }


  const badge =
    $("change");


  badge.className =
    "change " +
    (
      change > 0
        ? "up"
        : change < 0
          ? "down"
          : "same"
    );


  badge.textContent =
    change > 0
      ? "▲ " +
        money(change) +
        " / gram"

      : change < 0
        ? "▼ " +
          money(
            Math.abs(change)
          ) +
          " / gram"

        : "No rate change";


  const lastChange =
    d.last_change;


  if (lastChange) {

    $("lastDate")
      .textContent =
      dateText(
        lastChange.date
      );


    $("lastTime")
      .textContent =
      timeText(
        lastChange.time
      ) +
      (
        lastChange.session
          ? " · " +
            lastChange.session
          : ""
      );


    const amount =
      Number(
        lastChange.change
      );


    if (amount > 0) {

      $("lastAmount")
        .textContent =
        "▲ " +
        money(amount);

    } else if (amount < 0) {

      $("lastAmount")
        .textContent =
        "▼ " +
        money(
          Math.abs(amount)
        );

    } else {

      $("lastAmount")
        .textContent =
        "• No change";
    }


    $("lastAmount")
      .className =
      "amount " +
      (
        amount > 0
          ? "positive"
          : amount < 0
            ? "negative"
            : ""
      );

  } else {

    $("lastDate")
      .textContent =
      "No recorded change";

    $("lastTime")
      .textContent =
      "—";

    $("lastAmount")
      .textContent =
      "—";

    $("lastAmount")
      .className =
      "amount";
  }


  renderToday();
}


/* =========================================================
   TODAY
   ========================================================= */

function renderToday() {

  if (!live) {
    return;
  }


  const today =
    live.date;


  const changes =
    Array.isArray(
      live.intraday
    )
      ? live.intraday.filter(
          item =>
            item.date === today
        )
      : [];


  let am =
    changes.find(
      item =>
        item.session === "AM"
    );


  let pm =
    changes.find(
      item =>
        item.session === "PM"
    );


  if (
    !am &&
    live.session === "AM"
  ) {

    am = {
      rate_22k:
        live.rate_22k,

      time:
        live.time
    };
  }


  if (
    !pm &&
    live.session === "PM"
  ) {

    pm = {
      rate_22k:
        live.rate_22k,

      time:
        live.time
    };
  }


  $("amRate")
    .textContent =
    am
      ? money(am.rate_22k)
      : "—";


  $("amTime")
    .textContent =
    am
      ? timeText(am.time)
      : "Not recorded";


  $("pmRate")
    .textContent =
    pm
      ? money(pm.rate_22k)
      : "—";


  $("pmTime")
    .textContent =
    pm
      ? timeText(pm.time)
      : "Not recorded";


  $("todaySummary")
    .textContent =
    changes.length
      ? changes.length +
        " detected change" +
        (
          changes.length === 1
            ? ""
            : "s"
        )
      : "No detected change";
}


/* =========================================================
   CHART DATA
   ========================================================= */

function chartData() {

  if (
    selectedRange === "all"
  ) {

    return history;
  }


  return history.slice(
    Math.max(
      0,
      history.length -
      Number(selectedRange)
    )
  );
}


/* =========================================================
   DRAW CHART
   ========================================================= */

function drawChart() {

  const canvas =
    $("chart");

  if (!canvas) {
    return;
  }


  const box =
    canvas.parentElement;


  const width =
    box.clientWidth;


  const height =
    box.clientHeight;


  const dpr =
    window.devicePixelRatio || 1;


  if (
    !width ||
    !height
  ) {
    return;
  }


  canvas.width =
    Math.round(
      width * dpr
    );


  canvas.height =
    Math.round(
      height * dpr
    );


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const data =
    chartData();


  $("chartCount")
    .textContent =
    data.length.toLocaleString(
      "en-IN"
    ) +
    (
      data.length === 1
        ? " day"
        : " days"
    );


  if (data.length < 2) {

    ctx.fillStyle =
      "#8a8073";

    ctx.textAlign =
      "center";

    ctx.font =
      "13px system-ui";

    ctx.fillText(
      "Not enough historical data",
      width / 2,
      height / 2
    );

    return;
  }


  const values =
    data.map(
      item =>
        Number(
          item.rate_22k
        )
    );


  const min0 =
    Math.min(...values);


  const max0 =
    Math.max(...values);


  const pad =
    Math.max(
      80,
      (max0 - min0) * .1
    );


  const min =
    min0 - pad;


  const max =
    max0 + pad;


  const L = 44;
  const R = 10;
  const T = 12;
  const B = 25;


  const plotWidth =
    width - L - R;


  const plotHeight =
    height - T - B;


  const px =
    i =>
      L +
      (
        i /
        (data.length - 1)
      ) *
      plotWidth;


  const py =
    value =>
      T +
      (
        1 -
        (
          (value - min) /
          (max - min)
        )
      ) *
      plotHeight;


  ctx.font =
    "10px system-ui";

  ctx.lineWidth =
    1;

  ctx.textAlign =
    "right";


  for (
    let i = 0;
    i <= 4;
    i++
  ) {

    const gy =
      T +
      plotHeight *
      i / 4;


    ctx.strokeStyle =
      "rgba(131,117,103,.16)";


    ctx.beginPath();


    ctx.moveTo(
      L,
      gy
    );


    ctx.lineTo(
      width - R,
      gy
    );


    ctx.stroke();


    const value =
      max -
      (
        max - min
      ) *
      i / 4;


    ctx.fillStyle =
      "#8a8073";


    ctx.fillText(
      money(value),
      L - 5,
      gy + 3
    );
  }


  /* AREA */

  ctx.beginPath();


  ctx.moveTo(
    px(0),
    py(values[0])
  );


  for (
    let i = 1;
    i < values.length;
    i++
  ) {

    ctx.lineTo(
      px(i),
      py(values[i])
    );
  }


  ctx.lineTo(
    px(values.length - 1),
    height - B
  );


  ctx.lineTo(
    px(0),
    height - B
  );


  ctx.closePath();


  const gradient =
    ctx.createLinearGradient(
      0,
      T,
      0,
      height
    );


  gradient.addColorStop(
    0,
    "rgba(124,89,0,.22)"
  );


  gradient.addColorStop(
    1,
    "rgba(124,89,0,.02)"
  );


  ctx.fillStyle =
    gradient;


  ctx.fill();


  /* LINE */

  ctx.beginPath();


  ctx.moveTo(
    px(0),
    py(values[0])
  );


  for (
    let i = 1;
    i < values.length;
    i++
  ) {

    ctx.lineTo(
      px(i),
      py(values[i])
    );
  }


  ctx.strokeStyle =
    "#7c5900";


  ctx.lineWidth =
    2.5;


  ctx.lineJoin =
    "round";


  ctx.lineCap =
    "round";


  ctx.stroke();


  /* LAST POINT */

  ctx.fillStyle =
    "#7c5900";


  ctx.beginPath();


  ctx.arc(
    px(values.length - 1),
    py(
      values[
        values.length - 1
      ]
    ),
    4,
    0,
    Math.PI * 2
  );


  ctx.fill();


  $("chartStart")
    .textContent =
    dateText(
      data[0].date
    );


  $("chartEnd")
    .textContent =
    dateText(
      data[data.length - 1].date
    );


  const first =
    values[0];


  const last =
    values[
      values.length - 1
    ];


  const delta =
    last - first;


  const percentage =
    first
      ? (
          delta /
          first *
          100
        )
      : 0;


  $("periodChange")
    .textContent =
    (
      delta >= 0
        ? "+"
        : ""
    ) +
    money(delta) +
    " (" +
    (
      percentage >= 0
        ? "+"
        : ""
    ) +
    percentage.toFixed(1) +
    "%)";


  $("periodChange")
    .className =
    delta > 0
      ? "positive"
      : delta < 0
        ? "negative"
        : "";


  $("periodHigh")
    .textContent =
    money(max0);


  $("periodLow")
    .textContent =
    money(min0);
}


/* =========================================================
   STATISTICS
   ========================================================= */

function renderStats() {

  if (!history.length) {
    return;
  }


  const values =
    history.map(
      item =>
        Number(
          item.rate_22k
        )
    );


  const high =
    Math.max(...values);


  const low =
    Math.min(...values);


  const highItem =
    history.find(
      item =>
        Number(
          item.rate_22k
        ) === high
    );


  const lowItem =
    history.find(
      item =>
        Number(
          item.rate_22k
        ) === low
    );


  $("high")
    .textContent =
    money(high);


  $("low")
    .textContent =
    money(low);


  $("highDate")
    .textContent =
    dateText(
      highItem?.date
    );


  $("lowDate")
    .textContent =
    dateText(
      lowItem?.date
    );


  $("historyCount")
    .textContent =
    history.length.toLocaleString(
      "en-IN"
    ) +
    " records";


  $("historyBody")
    .innerHTML =
    [...history]
      .reverse()
      .slice(0,300)
      .map(
        item =>
          `
          <tr>
            <td>
              ${esc(
                dateText(item.date)
              )}
            </td>

            <td>
              ${money(
                item.rate_22k
              )}
            </td>

            <td>
              ${money(
                Number(
                  item.rate_22k
                ) * 8
              )}
            </td>
          </tr>
          `
      )
      .join("");


  if (!$("dateA").value) {

    $("dateA").value =
      history[0]?.date || "";
  }


  if (!$("dateB").value) {

    $("dateB").value =
      history[
        history.length - 1
      ]?.date || "";
  }


  compareDates();

  drawChart();
}


/* =========================================================
   COMPARE DATES
   ========================================================= */

function compareDates() {

  const dateA =
    $("dateA").value;


  const dateB =
    $("dateB").value;


  const a =
    history.find(
      item =>
        item.date === dateA
    );


  const b =
    history.find(
      item =>
        item.date === dateB
    );


  const output =
    $("compareResult");


  if (!a || !b) {

    output.textContent =
      "Choose two dates available in the historical data.";

    return;
  }


  const difference =
    Number(b.rate_22k) -
    Number(a.rate_22k);


  const percentage =
    Number(a.rate_22k)
      ? (
          difference /
          Number(a.rate_22k) *
          100
        )
      : 0;


  output.innerHTML =
    `
    <strong>
      ${money(a.rate_22k)}
      →
      ${money(b.rate_22k)}
    </strong>

    <br>

    <span class="${
      difference > 0
        ? "positive"
        : difference < 0
          ? "negative"
          : ""
    }">

      ${
        difference >= 0
          ? "+"
          : ""
      }

      ${money(difference)}

      / gram ·

      ${
        percentage >= 0
          ? "+"
          : ""
      }

      ${percentage.toFixed(2)}%

    </span>

    <br>

    <small>

      ${dateText(a.date)}

      →

      ${dateText(b.date)}

      · 8g difference

      ${money(difference * 8)}

    </small>
    `;
}


/* =========================================================
   CALCULATOR
   ========================================================= */

function calculate() {

  if (!live) {
    return;
  }


  const rate =
    Number(
      live.rate_22k
    );


  if (
    !Number.isFinite(rate) ||
    rate <= 0
  ) {
    return;
  }


  const weight =
    Math.max(
      0,
      Number(
        $("weight").value
      ) || 0
    );


  const budget =
    Math.max(
      0,
      Number(
        $("budget").value
      ) || 0
    );


  const making =
    Math.max(
      0,
      Number(
        $("making").value
      ) || 0
    );


  if (
    $("calcMode").value ===
    "value"
  ) {

    const goldValue =
      rate *
      weight;


    const total =
      goldValue *
      (
        1 +
        making / 100
      );


    $("calcResult")
      .textContent =
      money(total);


    $("calcSub")
      .textContent =
      `${weight.toLocaleString("en-IN")} g · gold ${money(goldValue)} · making charge ${making}%`;

  } else {

    const grams =
      budget /
      (
        rate *
        (
          1 +
          making / 100
        )
      );


    $("calcResult")
      .textContent =
      Number.isFinite(grams)
        ? grams.toFixed(3) +
          " g"
        : "0.000 g";


    $("calcSub")
      .textContent =
      `Budget ${money(budget)} including ${making}% making charge`;
  }
}


/* =========================================================
   LOAD PUBLISHED DATA
   ========================================================= */

async function loadPublishedData() {

  const results =
    await Promise.all([
      getJSON(LIVE_URL),
      getJSON(HISTORY_URL)
    ]);


  const latest =
    results[0];


  const historical =
    results[1];


  renderLive(
    latest
  );


  history =
    normalize(
      historical
    );


  renderStats();

  calculate();


  localStorage.setItem(
    "gold_live_backup",
    JSON.stringify(
      latest
    )
  );


  localStorage.setItem(
    "gold_history_backup",
    JSON.stringify(
      history
    )
  );


  return latest;
}


/* =========================================================
   NORMAL REFRESH
   ========================================================= */

async function refresh(
  manual = false
) {

  const button =
    $("refresh");


  if (manual) {

    button.classList.remove(
      "spin"
    );

    void button.offsetWidth;

    button.classList.add(
      "spin"
    );
  }


  try {

    setStatus(
      "Checking latest rate…"
    );


    await loadPublishedData();


    setStatus(
      "Updated " +
      new Date()
        .toLocaleTimeString(
          "en-IN",
          {
            hour: "numeric",
            minute: "2-digit"
          }
        )
    );


    if (manual) {

      toast(
        "Latest data loaded"
      );
    }

  } catch (error) {

    console.error(
      "Refresh error:",
      error
    );


    try {

      const savedLive =
        JSON.parse(
          localStorage.getItem(
            "gold_live_backup"
          ) || "null"
        );


      const savedHistory =
        JSON.parse(
          localStorage.getItem(
            "gold_history_backup"
          ) || "null"
        );


      if (savedLive) {

        renderLive(
          savedLive
        );
      }


      if (
        Array.isArray(
          savedHistory
        )
      ) {

        history =
          normalize(
            savedHistory
          );

        renderStats();

        calculate();
      }


      setStatus(
        "Offline · showing saved data",
        true
      );

    } catch (backupError) {

      console.error(
        "Backup error:",
        backupError
      );


      setStatus(
        "Unable to load data",
        true
      );
    }
  }
}


/* =========================================================
   GET CURRENT PUBLISHED TIMESTAMP
   ========================================================= */

function getDataTimestamp(
  data
) {

  if (!data) {
    return "";
  }


  return (
    data.last_checked_at ||
    data.last_checked ||
    data.timestamp ||
    data.updated_at ||
    (
      String(
        data.date || ""
      ) +
      "|" +
      String(
        data.time || ""
      )
    )
  );
}


/* =========================================================
   WAIT FOR GITHUB DATA
   ========================================================= */

async function waitForUpdatedData(
  oldTimestamp
) {

  const maxAttempts = 12;


  for (
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ) {

    await sleep(
      attempt === 1
        ? 1500
        : 2000
    );


    try {

      const latest =
        await getJSON(
          LIVE_URL
        );


      const newTimestamp =
        getDataTimestamp(
          latest
        );


      /*
       * If GitHub has published a new
       * timestamp, stop immediately.
       */

      if (
        newTimestamp &&
        newTimestamp !==
        oldTimestamp
      ) {

        return latest;
      }


      /*
       * If the rate itself changed,
       * that is also enough.
       */

      if (
        live &&
        Number(
          latest.rate_22k
        ) !==
        Number(
          live.rate_22k
        )
      ) {

        return latest;
      }

    } catch (error) {

      console.warn(
        "Waiting for updated data:",
        error
      );
    }
  }


  /*
   * Return the newest available
   * published JSON after timeout.
   */

  return getJSON(
    LIVE_URL
  );
}


/* =========================================================
   MANUAL FETCH
   ========================================================= */

async function manualFetch() {

  if (fetchBusy) {
    return;
  }


  fetchBusy = true;


  const button =
    $("fetchNow");


  const buttonText =
    $("fetchNowText");


  const refreshIcon =
    $("refresh");


  button.disabled =
    true;


  button.classList.add(
    "fetching"
  );


  refreshIcon.classList.add(
    "fetching"
  );


  buttonText.textContent =
    "Fetching latest rate…";


  try {

    setStatus(
      "Contacting gold-price server…"
    );


    /*
     * Remember current published data.
     */

    const oldLive =
      live;


    const oldTimestamp =
      getDataTimestamp(
        oldLive
      );


    /*
     * =====================================================
     * THIS IS THE IMPORTANT FIX
     * =====================================================
     *
     * Your Cloudflare Worker returns:
     *
     *     405 POST required
     *
     * when GET is used.
     *
     * Therefore the app MUST send POST.
     */

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              force: true
            }),

          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Worker HTTP " +
        response.status
      );
    }


    /*
     * Read Worker response if JSON.
     */

    let workerResult = null;


    try {

      workerResult =
        await response.json();

    } catch (_) {

      /*
       * Worker response does not
       * necessarily need to be JSON.
       */
    }


    console.log(
      "Cloudflare Worker response:",
      workerResult
    );


    setStatus(
      "Worker completed · waiting for GitHub…"
    );


    /*
     * GitHub Actions / GitHub Pages may need
     * a few seconds before live.json contains
     * the newly generated data.
     */

    const newestLive =
      await waitForUpdatedData(
        oldTimestamp
      );


    /*
     * Fetch history again.
     */

    const newestHistory =
      await getJSON(
        HISTORY_URL
      );


    /*
     * Render the NEW data.
     */

    renderLive(
      newestLive
    );


    history =
      normalize(
        newestHistory
      );


    renderStats();

    calculate();


    /*
     * Save backup.
     */

    localStorage.setItem(
      "gold_live_backup",
      JSON.stringify(
        newestLive
      )
    );


    localStorage.setItem(
      "gold_history_backup",
      JSON.stringify(
        history
      )
    );


    setStatus(
      "Fetched · " +
      dateText(
        newestLive.date
      ) +
      " · " +
      timeText(
        newestLive.time
      )
    );


    /*
     * Tell user whether rate changed.
     */

    if (
      oldLive &&
      Number(
        oldLive.rate_22k
      ) ===
      Number(
        newestLive.rate_22k
      )
    ) {

      toast(
        "Rate checked · no change"
      );

    } else {

      toast(
        "Latest rate updated"
      );
    }


  } catch (error) {

    console.error(
      "Manual fetch failed:",
      error
    );


    setStatus(
      "Fetch failed · showing saved data",
      true
    );


    toast(
      "Unable to fetch latest rate"
    );

  } finally {

    fetchBusy =
      false;


    button.disabled =
      false;


    button.classList.remove(
      "fetching"
    );


    refreshIcon.classList.remove(
      "fetching"
    );


    buttonText.textContent =
      "Fetch latest rate";
  }
}


/* =========================================================
   EVENT HANDLERS
   ========================================================= */

/* Top refresh — same full fetch as the Fetch button */

$("refresh").onclick =
  manualFetch;


/* Main Fetch button */

$("fetchNow").onclick =
  manualFetch;


/* =========================================================
   SWIPE DOWN TO REFRESH
   (same full fetch as the Fetch button)
   ========================================================= */

(function setupPullToRefresh() {

  const PULL_THRESHOLD = 68;
  const PULL_MAX = 100;

  const pulldown =
    $("pulldown");

  const pulldownText =
    $("pulldownText");

  let startY = null;
  let dragging = false;
  let ready = false;


  function atTop() {

    return (
      (window.scrollY || 0) <= 0 &&
      (document.scrollingElement
        ? document.scrollingElement.scrollTop
        : 0) <= 0
    );
  }


  function resetPulldown() {

    pulldown.classList.remove(
      "visible",
      "ready",
      "loading"
    );

    pulldown.style.transform = "";

    pulldownText.textContent =
      "Pull to refresh";

    startY = null;
    dragging = false;
    ready = false;
  }


  document.addEventListener(
    "touchstart",
    event => {

      if (fetchBusy) {
        return;
      }

      if (
        event.target.closest(
          ".tablewrap"
        )
      ) {
        return;
      }

      if (!atTop()) {
        return;
      }

      startY =
        event.touches[0].clientY;

      dragging = true;
      ready = false;
    },
    { passive: true }
  );


  document.addEventListener(
    "touchmove",
    event => {

      if (
        !dragging ||
        startY === null
      ) {
        return;
      }

      if (!atTop()) {
        resetPulldown();
        return;
      }

      const delta =
        event.touches[0].clientY -
        startY;

      if (delta <= 0) {
        return;
      }

      /*
       * We're actively taking over this gesture as a
       * custom pull-to-refresh, so stop the browser's own
       * native swipe-to-reload from firing at the same time
       * (that native reload was overriding our fetch flow).
       */

      if (event.cancelable) {

        event.preventDefault();
      }

      const pulled =
        Math.min(
          delta * .55,
          PULL_MAX
        );

      pulldown.classList.add(
        "visible"
      );

      pulldown.style.transform =
        "translate(-50%," +
        (
          pulled - 70
        ) +
        "px)";

      ready =
        pulled >=
        PULL_THRESHOLD * .55;

      pulldown.classList.toggle(
        "ready",
        ready
      );

      pulldownText.textContent =
        ready
          ? "Release to refresh"
          : "Pull to refresh";
    },
    { passive: false }
  );


  document.addEventListener(
    "touchend",
    () => {

      if (!dragging) {
        return;
      }

      if (ready && !fetchBusy) {

        pulldown.classList.add(
          "loading"
        );

        pulldown.classList.remove(
          "ready"
        );

        pulldown.style.transform =
          "translate(-50%,14px)";

        pulldownText.textContent =
          "Refreshing…";

        manualFetch().finally(
          resetPulldown
        );

      } else {

        resetPulldown();
      }

      dragging = false;
      startY = null;
    },
    { passive: true }
  );


  document.addEventListener(
    "touchcancel",
    resetPulldown,
    { passive: true }
  );
})();


/* Chart range buttons */

document
  .querySelectorAll(
    "#ranges button"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          document
            .querySelectorAll(
              "#ranges button"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          selectedRange =
            button.dataset.range ===
            "all"
              ? "all"
              : Number(
                  button.dataset.range
                );


          drawChart();
        };
    }
  );


/* Date comparison */

[
  "dateA",
  "dateB"
]
.forEach(
  id => {

    $(id)
      .addEventListener(
        "change",
        compareDates
      );
  }
);


/* Calculator */

[
  "weight",
  "budget",
  "making"
]
.forEach(
  id => {

    $(id)
      .addEventListener(
        "input",
        calculate
      );
  }
);


$("calcMode")
  .addEventListener(
    "change",
    calculate
  );


/* Refresh when app becomes visible */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      refresh();
    }
  }
);


/* Safari / iOS */

window.addEventListener(
  "pageshow",
  () => {

    refresh();
  }
);


/* Resize chart */

window.addEventListener(
  "resize",
  drawChart
);


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "sw.js"
        )
        .catch(
          error =>
            console.warn(
              "Service worker:",
              error
            )
        );
    }
  );
}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

refresh();

</script>

</body>
</html>
