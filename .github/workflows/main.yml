name: Update Chennai 22K Gold Rate

on:
  workflow_dispatch:

  schedule:
    # Start before the learned AM monitoring window
    - cron: "00 03 * * *"

    # Start before the learned PM monitoring window
    - cron: "00 10 * * *"

permissions:
  contents: write

concurrency:
  group: chennai-22k-gold-updater
  cancel-in-progress: false

jobs:
  update:
    name: Update Chennai 22K Gold Rate
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Monitor and update Chennai 22K rate
        run: |
          python update_gold.py

      - name: Verify generated data
        run: |
          echo "Checking generated data files..."

          if [ ! -f "data/live.json" ]; then
            echo "ERROR: data/live.json was not created."
            exit 1
          fi

          if [ ! -f "data/history.json" ]; then
            echo "ERROR: data/history.json was not created."
            exit 1
          fi

          echo "Generated data files are present."

          echo ""
          echo "Current live data:"
          cat data/live.json

      - name: Show current live data
        run: |
          echo "Current live data:"
          cat data/live.json

      - name: Save updated data
        run: |
          git config user.name "Chennai 22K Gold Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/live.json data/history.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git commit -m "Update Chennai 22K gold rate"

          git push origin HEAD:main
