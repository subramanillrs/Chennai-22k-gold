name: Update Chennai 22K Gold Rate

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update Chennai 22K rate and history
        run: python update_gold.py

      - name: Save updated data
        run: |
          git config user.name "Chennai 22K Gold Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/live.json data/history.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Chennai 22K gold rate"
            git push
          fi
