name: Monitor and Update Chennai 22K Gold

on:
  workflow_dispatch:

  schedule:
    # 08:30 AM IST = 03:00 UTC
    - cron: "0 3 * * *"

    # 05:00 PM IST = 11:30 UTC
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 210

    steps:

      # ----------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # PYTHON
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ----------------------------------------------------
      # START GOLD MONITOR
      # ----------------------------------------------------
      - name: Monitor and update Chennai 22K rate
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "============================================================"
          echo "CHENNAI 22K GOLD RATE MONITOR"
          echo "============================================================"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Starting update_gold.py..."
          echo ""
          echo "Scheduled runs:"
          echo "AM  : 08:30 - 11:30 IST"
          echo "PM  : 17:00 - 20:00 IST"
          echo ""
          echo "During the monitoring window the program checks"
          echo "LiveChennai + GoodReturns every 10 seconds."
          echo "============================================================"

          python update_gold.py

      # ----------------------------------------------------
      # VERIFY DATA
      # ----------------------------------------------------
      - name: Verify generated data
        run: |
          echo "Checking generated data files..."

          if [ -f data/live.json ]; then
            echo "live.json: OK"
          else
            echo "ERROR: live.json missing"
            exit 1
          fi

          if [ -f data/history.json ]; then
            echo "history.json: OK"
          else
            echo "history.json missing - creating empty file"
            echo "[]" > data/history.json
          fi

          if [ -f data/monitoring_windows.json ]; then
            echo "monitoring_windows.json: OK"
          else
            echo "monitoring_windows.json not generated"
          fi

      # ----------------------------------------------------
      # SHOW LIVE DATA
      # ----------------------------------------------------
      - name: Show current live data
        run: |
          echo "============================================================"
          echo "CURRENT LIVE DATA"
          echo "============================================================"

          if [ -f data/live.json ]; then
            cat data/live.json
          fi

      # ----------------------------------------------------
      # SHOW MONITORING WINDOW
      # ----------------------------------------------------
      - name: Show monitoring window
        run: |
          echo "============================================================"
          echo "MONITORING WINDOW"
          echo "============================================================"

          if [ -f data/monitoring_windows.json ]; then
            cat data/monitoring_windows.json
          fi

      # ----------------------------------------------------
      # SAVE UPDATED DATA
      # ----------------------------------------------------
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/live.json
          git add data/history.json
          git add data/monitoring_windows.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Chennai 22K gold rate"
            git push
          fi
